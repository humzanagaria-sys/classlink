<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cloud Terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECURE GATEWAY FACADE -->
    <div class="portal-wrapper" id="authGate">
        <h2>Device Registration</h2>
        <p>Enter local workspace network credentials</p>
        <input type="text" class="form-input" placeholder="User Token / Node AddressID">
        <input type="password" class="form-input" id="accessPasscode" placeholder="Node Pin Verification">
        <button class="submit-btn" onclick="verifySecureHandshake()">Initialize Workspace</button>
    </div>

    <!-- PREMIUM REWRITTEN SIDEBAR DASHBOARD -->
    <div class="arcade-layout" id="appDashboard">
        <aside class="sidebar">
            <div class="brand-header">🌐 Node Console Alpha</div>
            <div class="menu-label">Local Applications</div>
            <button class="menu-item" onclick="launchSimulation('snake', this)">🕹️ Classic Snake</button>
            <button class="menu-item" onclick="launchSimulation('breakout', this)">🧱 Breakout Matrix</button>
            <button class="menu-item" onclick="launchSimulation('pong', this)">🏓 Quantum Pong</button>
            <button class="menu-item style-mc" onclick="launchMinecraft(this)">⛏️ Eagler Craft MC</button>
        </aside>

        <main class="main-stage">
            <div class="welcome-card" id="idleNotice">
                <h3>Terminal Client Ready</h3>
                <p>Select a verified micro-application core application package sequence via the side utility panel layout options interface.</p>
            </div>

            <div class="game-viewport" id="viewportArea">
                <div class="hud-bar">
                    <span class="game-title-hud" id="hudTitle">Simulation</span>
                    <span class="score-hud">Score: <span id="hudScore">0</span></span>
                </div>
                <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                    <canvas id="gameCanvas" width="500" height="400"></canvas>
                    <iframe id="mcFrame" src="" width="800" height="480" style="display:none; border:none; border-radius:10px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);"></iframe>
                    <div class="screen-overlay" id="failScreen">
                        <h4>SIMULATION COMPLETE</h4>
                        <button class="restart-btn" onclick="restartSimulation()">Reboot Simulation</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
    <script src="games.js"></script>
</body>
</html>
